<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Registration - Skeleton Example</title>

    <style>
      .form-group {
        margin-bottom: 12px;
      }
      .form-group label {
        display: block;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="page-title">Create Your Account</h1>
    </header>

    <nav aria-label="Main navigation">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>

    <main>
      <form aria-labelledby="page-title">
        <fieldset>
          <legend>Personal Information</legend>

          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input
              type="text"
              id="fullname"
              name="fullname"
              required
              minlength="2"
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{9,10}" />
          </div>

          <div class="form-group">
            <label for="country">Country</label>
            <select id="country" name="country" required>
              <option value="">Select your country</option>
              <option value="usa">United States</option>
              <option value="thailand">Thailand</option>
              <option value="uk">United Kingdom</option>
              <option value="australia">Australia</option>
            </select>
          </div>

          <div class="form-group">
            <label for="bday">Birthday</label>
            <input type="date" id="bday" name="bday" />
          </div>

          <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
              <option value="">Select your gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="0" />
          </div>
        </fieldset>

        <fieldset>
          <legend>Account Details</legend>

          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              required
              minlength="5"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              minlength="8"
            />
          </div>

          <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              required
              minlength="8"
            />
          </div>
        </fieldset>

        <div class="form-group">
          <input type="checkbox" id="terms" name="terms" required />
          <label for="terms" style="display: inline"
            >I agree to the terms and conditions</label
          >
        </div>

        <button type="submit">Register</button>
      </form>
    </main>
    <img
      src="Nu_Html_Checker.png"
      placeholder="HTML Checker"
      alt="HTML Checker"
      height="1000"
      width="1000"
    />
    <footer>
      <p>Edited by Paradon Lambensa 6710510278</p>
    </footer>
  </body>
</html>

<!-- Accessibility Note & AI Reflection
สิ่งที่ AI audit พบ
- แท็ก <nav> ไม่มี aria-label ระบุว่าเป็น navigation ส่วนไหน ซึ่งช่วยให้ screen reader สื่อสารบริบทได้ชัดเจนขึ้นเมื่อหน้ามี navigation หลายส่วน
- แท็ก <form> ไม่มี aria-labelledby หรือ aria-describedby เพื่อให้ screen reader เข้าใจบริบทของฟอร์มได้ดีขึ้น
- ฟอร์มใช้ browser-native validation (required, pattern, minlength) แต่ไม่มี aria-describedby เชื่อมข้อความ error กับ input โดยตรง
- แท็ก <footer> ไม่มี aria-label หรือ role="contentinfo" เพื่อให้ screen reader เข้าใจว่าเป็นส่วน footer ของหน้า
สิ่งที่แก้ไป
- เพิ่ม aria-label ให้กับ <nav> เพื่อระบุว่าเป็น navigation หลักของหน้า
- เพิ่ม aria-labelledby ให้กับ <form> เพื่อให้ screen reader เข้าใจบริบทของฟอร์ม
สิ่งที่เลือกไม่แก้ และเหตุผล
- ไม่เพิ่ม aria-describedby ให้กับ input fields เพราะฟอร์มนี้ใช้ browser-native validation และมีข้อความ error ที่แสดงขึ้นเมื่อผู้ใช้กรอกข้อมูลไม่ถูกต้องอยู่แล้ว ซึ่งถือว่าเพียงพอสำหรับผู้ใช้ทั่วไป
- ไม่เพิ่ม role="contentinfo" ให้ footer เพราะ <footer> เป็น semantic HTML5 element ที่ browser และ screen reader สมัยใหม่ตีความ role นี้ให้อัตโนมัติอยู่แล้ว
สิ่งที่ได้เรียนรู้
- การใช้ attribute ของ HTML อย่างถูกต้องสามารถช่วยให้เว็บไซต์มีความเข้าถึงได้ดีขึ้น
- การใช้ ARIA attributes ช่วยให้ screen reader สามารถเข้าใจบริบทของ element ต่างๆ ได้ดีขึ้น
- การใช้ semantic HTML5 elements เช่น <header>, <nav>, <main>, และ <footer> ช่วยให้โครงสร้างของหน้าเว็บชัดเจนและเข้าถึงได้ง่ายขึ้น
- การใช้ browser-native validation ช่วยให้ผู้ใช้ได้รับ feedback ทันทีเมื่อกรอกข้อมูลไม่ถูกต้อง โดยไม่ต้องพึ่งพา JavaScript เพิ่มเติม -->
